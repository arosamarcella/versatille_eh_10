<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Versatille - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sirivennela:ital,wght@0,400&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap LOCAL -->
    <link rel="stylesheet" href="css_js/bootstrap/css/bootstrap.css">
</head>

<body style="margin: 0; padding: 0;">

    <!-- ========== NAVBAR ========== -->
    <header>
        <nav class="navbar navbar-expand" style="background-color: #AF2767; height: 5vh; color: #fff; padding: 1vh;">
            <div class="container-fluid" style="display: grid; grid-template-columns: auto auto auto auto; align-items: center; transform: translateY(-15px);">

                <a class="navbar-brand" style="text-decoration: none; color: #ffff; margin-left: 50px;" href="index.html">
                    <h1 class="m-0">VERSATILLE</h1>
                </a>

                <a class="nav-link" style="text-decoration: none; color: #ffff; margin-left: 50px;" href="sobre_versatille.html">Sobre o Versatille</a>

                <a class="nav-link" style="text-decoration: none; color: #ffff; margin-left: 50px;" href="guarda-roupa.html">Guarda-Roupa</a>

                <a class="btn" style="border-radius: 10px; background-color: #FFD8D3; max-width: 15vh; padding: 0.5vh; text-align: center; color: black; text-decoration: none; border: none;" href="login.html" id="entrar">Entrar</a>

            </div>
        </nav>
    </header>

    <!-- ========== CONTEÚDO - LOGIN ========== -->
    <main class="container" style="display: grid; grid-template-rows: auto auto auto; text-align: center; margin-top: 200px;">

        <!-- Formulário -->
        <form action="login.html" method="GET">

            <!-- Campo Nome -->
            <div class="mb-3">
                <span style="font-family: 'Instrument Serif', serif;">Por favor, preencha o seu nome.</span>

                <div class="mt-2" style="margin-bottom: 1vh;">
                    <input type="text" id="nomeInput" name="nome" placeholder="Nome" autocomplete="username" required class="form-control mx-auto" style="border-radius: 10px; padding: 1vh; width: 50%; background-color: #af2767; color: #fff; border: none;">
                </div>
            </div>

            <!-- Campo Senha -->
            <div class="mb-3">
                <span style="font-family: 'Instrument Serif', serif;">Por favor, insira sua senha.</span>
                <div class="mt-2" style="margin-bottom: 5vh;">
                    <input type="password" id="senhaInput" name="senha" placeholder="Senha" autocomplete="current-password" required class="form-control mx-auto" style="border-radius: 10px; padding: 1vh; width: 50%; background-color: #af2767; color: #fff; border: none;">
                </div>
            </div>

            <!-- Botão Submit -->
            <input type="submit" value="Entrar" class="btn mx-auto d-block" style="border-radius: 10px; padding: 1vh; width: 50%; background-color: #af2767; color: #fff; border: none;">

        </form>

        <a class="d-block" style="padding-top: 5vh; text-decoration: none; color: #AF2767;" href="cadastro_dados.html">Não tem conta? Cadastre-se agora!</a>

    </main>

    <!-- Bootstrap JS LOCAL -->
    <script src="css_js/bootstrap/js/bootstrap.bundle.js"></script>

</body>
</html>
