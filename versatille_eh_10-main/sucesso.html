<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Versatille - Concluído</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sirivennela:ital,wght@0,400&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- BOOTSTRAP LOCAL -->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">

    <!-- SEU CSS LOCAL -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barra de navegação -->
    <header>
        <nav class="navbar-versatille">
            <div class="nav-grid">
                <!-- Links de navegação -->
                <a class="nav-brand" href="index.html">
                    <h1>VERSATILLE</h1>
                </a>

                <a class="nav-link-custom" href="sobre_versatille.html">Sobre o Versatille</a>

                <a class="nav-link-custom" href="guarda-roupa.html">Guarda-Roupa</a>

                <!-- Botão de entrar -->
                <a href="login.html" id="entrar" class="btn-entrar">Entrar</a>
            </div>
        </nav>
    </header>

    <!-- Conteúdo - Concluído -->
    <div class="cadastro-container text-center">
        <!-- Indicador de Etapas -->
        <div class="step-indicator">
            <div class="step-item">
                <span>Seus Dados</span>
                <div class="step-circle"></div>
            </div>
            <div class="step-item">
                <span>Email e Senha</span>
                <div class="step-circle"></div>
            </div>
            <div class="step-item">
                <span>Escolher Foto</span>
                <div class="step-circle"></div>
            </div>
            <div class="step-item">
                <span>Concluído!</span>
                <div class="step-circle active-circle">
                    <div class="step-dot"></div>
                </div>
            </div>
        </div>

        <!-- Mensagem de Sucesso -->
        <div class="success-message-box">
            Cadastro concluído!
        </div>

        <!-- Botão para continuar / ir para o Guarda-Roupa -->
        <div class="form-actions-center">
            <a href="guarda-roupa.html" class="btn-prosseguir">Continuar para o Guarda-Roupa</a>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer-versatille">
        <a class="footer-brand" href="index.html">
            <h1 class="text-center">VERSATILLE</h1>
        </a>

        <!-- Imagem do Rodapé -->
        <div class="footer-img-container">
            <img src="IMG/rodape2.png" alt="Rodapé Versatille" class="footer-img">
        </div>
    </footer>

    <!-- Bootstrap JS LOCAL -->
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
