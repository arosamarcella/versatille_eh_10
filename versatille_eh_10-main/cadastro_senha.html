<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Versatille - Email e Senha</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sirivennela:ital,wght@0,400&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- BOOTSTRAP LOCAL (Mesmo caminho do cadastro_dados.html) -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">

    <!-- SEU CSS LOCAL -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barra de navegação -->
    <header>
        <nav class="navbar-versatille">
            <div class="nav-grid">
                <a class="nav-brand" href="index.html">
                    <h1>VERSATILLE</h1>
                </a>

                <a class="nav-link-custom" href="sobre_versatille.html">Sobre o Versatille</a>

                <a class="nav-link-custom" href="guarda-roupa.html">Guarda-Roupa</a>

                <a href="login.html" id="entrar" class="btn-entrar">Entrar</a>
            </div>
        </nav>
    </header>

    <!-- Conteúdo do Cadastro - Email e Senha -->
    <div class="cadastro-container">
        <!-- Indicador de Etapas -->
        <div class="step-indicator">
            <div class="step-item">
                <span>Seus Dados</span>
                <div class="step-circle"></div>
            </div>
            <div class="step-item">
                <span>Email e Senha</span>
                <div class="step-circle active-circle">
                    <div class="step-dot"></div>
                </div>
            </div>
            <div class="step-item">
                <span>Escolher Foto</span>
                <div class="step-circle"></div>
            </div>
            <div class="step-item">
                <span>Concluido!</span>
                <div class="step-circle"></div>
            </div>
        </div>

        <!-- Formulário com as mesmas classes do cadastro_dados.html -->
        <form action="cadastro_foto.html" method="GET">
            <div class="form-group-container">
                <div class="input-group-custom">
                    <label>Email</label>
                    <input type="email" placeholder="Insira seu email" required class="custom-input">
                </div>
                <div class="input-group-custom">
                    <label>Senha</label>
                    <input type="password" placeholder="Digite sua senha" required class="custom-input">
                </div>
                <div class="input-group-custom">
                    <label>Confirmar Senha</label>
                    <input type="password" placeholder="Confirme sua senha" required class="custom-input">
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="form-actions-between">
                <a href="cadastro_dados.html" class="btn-voltar">&#171; Volta</a>
                <button type="submit" class="btn-prosseguir">Prosseguir</button>
            </div>
        </form>
    </div>

    <!-- Rodapé -->
    <footer class="footer-versatille">
        <a class="footer-brand" href="index.html">
            <h1 class="text-center">VERSATILLE</h1>
        </a>

        <div class="footer-img-container">
            <img src="IMG/rodape2.png" alt="Rodapé Versatille" class="footer-img">
        </div>
    </footer>

    <!-- Bootstrap JS LOCAL -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
