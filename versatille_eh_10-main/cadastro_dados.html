
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Versatille</title>

    <!-- Bootstrap Local -->
    <link rel="stylesheet" href="css_js/bootstrap/css/bootstrap.css">

    <!-- CSS Personalizado Local -->
    <link rel="stylesheet" href="css_js/css/estilo_cadastroDados.css">
</head>

<body>

    <!-- Barra de navegação -->
    <header>
        <nav class="navbar-versatille">
            <div class="nav-grid">

                <!-- Logo -->
                <a class="nav-brand" href="index.html">
                    <h1>VERSATILLE</h1>
                </a>

                <!-- Links de navegação -->
                <a class="nav-link-custom" href="sobre_versatille.html">
                    Sobre o Versatille
                </a>

                <a class="nav-link-custom" href="guarda-roupa.html">
                    Guarda-Roupa
                </a>

                <!-- Botão de entrar -->
                <a href="login.html" id="entrar" class="btn-entrar">
                    Entrar
                </a>

            </div>
        </nav>
    </header>

    <!-- Conteúdo do Cadastro -->
    <main class="cadastro-container">

        <!-- Indicador de etapas -->
        <div class="step-indicator">

            <div class="step-item">
                <span>Seus Dados</span>

                <div class="step-circle active-circle">
                    <div class="step-dot"></div>
                </div>
            </div>

            <div class="step-item">
                <span>Email e Senha</span>

                <div class="step-circle"></div>
            </div>

            <div class="step-item">
                <span>Escolher Foto</span>

                <div class="step-circle"></div>
            </div>

            <div class="step-item">
                <span>Concluído!</span>

                <div class="step-circle"></div>
            </div>

        </div>

        <!-- Formulário de dados -->
        <form action="cadastro_senha.html" method="GET">

            <div class="form-group-container">

                <!-- Nome completo -->
                <div class="input-group-custom">
                    <label>Nome Completo</label>

                    <input
                        type="text"
                        placeholder="Insira seu nome completo"
                        required
                        class="custom-input"
                    >
                </div>

                <!-- Telefone -->
                <div class="input-group-custom">
                    <label>Telefone</label>

                    <input
                        type="tel"
                        placeholder="(00) 00000-0000"
                        required
                        class="custom-input"
                    >
                </div>

                <!-- Data de nascimento -->
                <div class="input-group-custom">
                    <label>Data de Nascimento</label>

                    <input
                        type="date"
                        required
                        class="custom-input"
                    >
                </div>

            </div>

            <!-- Botões de ação -->
            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-prosseguir"
                >
                    Prosseguir
                </button>

            </div>

        </form>

    </main>

    <!-- Rodapé -->
    <footer class="footer-versatille">

        <!-- Logo do rodapé -->
        <a class="footer-brand" href="index.html">
            <h1 class="text-center">VERSATILLE</h1>
        </a>

        <!-- Imagem do rodapé -->
        <div class="footer-img-container">
            <img
                src="IMG/rodape2.png"
                alt="Rodapé Versatille"
                class="footer-img"
            >
        </div>

    </footer>

</body>

</html>
