<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Versatille</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sirivennela:ital,wght@0,400&family=Special+Elite&display=swap" rel="stylesheet">

    <!-- Ícones (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS Externo -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barra de navegação -->
    <header>
        <nav class="navbar-versatille">
            <div class="nav-grid">
                <!-- Links de navegação -->
                <a class="nav-brand" href="cadastro.html">
                    <h1>VERSATILLE</h1>
                </a>
                <a class="nav-link-custom" href="sobre_versatille.html">Sobre o Versatille</a>
                <a class="nav-link-custom" href="guarda-roupa.html">Guarda-Roupa</a>

                <!-- Botão de entrar -->
                <a href="login.html" id="entrar" class="btn-entrar">Entrar</a>
            </div>
        </nav>
    </header>

    <!-- Conteúdo do Cadastro - Seus Dados -->
    <div class="cadastro-container">
        <!-- Indicador de Etapas -->
        <div class="step-indicator">
            <div class="step-item">
                <span>Seus Dados</span>
                <div class="step-circle active-circle">
                    <div class="step-dot"></div>
                </div>
            </div>
            <div class="step-item">
                <span>Email e Senha</span>
                <div class="step-circle"></div>
            </div>
            <div class="step-item">
                <span>Escolher Foto</span>
                <div class="step-circle"></div>
            </div>
            <div class="step-item">
                <span>Concluido!</span>
                <div class="step-circle"></div>
            </div>
        </div>

        <!-- Formulário de Dados -->
        <form action="cadastro_senha.html" method="GET">
            <div class="form-group-container">
                <div class="input-group-custom">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Insira seu nome completo" required class="custom-input">
                </div>
                <div class="input-group-custom">
                    <label>Telefone</label>
                    <input type="tel" placeholder="(00) 00000-0000" required class="custom-input">
                </div>
                <div class="input-group-custom">
                    <label>Data de Nascimento</label>
                    <input type="date" required class="custom-input">
                </div>
            </div>

            <!-- Botões de Ação -->
            <div class="form-actions">
                <button type="submit" class="btn-prosseguir">Prosseguir</button>
            </div>
        </form>
    </div>

    <!-- Rodapé -->
    <footer class="footer-versatille">
        <a class="footer-brand" href="cadastro.html">
            <h1 class="text-center">VERSATILLE</h1>
        </a>
        <div class="footer-img-container">
            <img src="IMG/rodape2.png" alt="Rodapé Versatille" class="footer-img">
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
